# Fanatic Arts — Netlify configuration
# Static Astro build; no adapter or serverless functions required.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Astro reads Netlify's URL for canonical links and the sitemap.
  # Set SITE_URL in the Netlify UI to override (e.g. before the domain is live).

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------
# Astro fingerprints everything in /_astro/, so those files can never go stale.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML must revalidate so content edits go live on the next request.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Everything the site needs is same-origin. 'unsafe-inline' covers Astro's
    # inlined critical CSS and the small no-JS bootstrap script in BaseLayout.
    #
    # NOTE: form-action is 'self' plus Netlify Forms. If you switch the contact
    # form to an external handler (Formspree, Basin, …), add that host here or
    # the submission will be blocked silently.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
